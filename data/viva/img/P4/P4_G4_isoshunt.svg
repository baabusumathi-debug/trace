   </g>
  </g>
  <g id="text_19">
   <text style="font-size: 10px; font-family:Inter, Arial, Helvetica, sans-serif" transform="translate(7.2 362.89)">Blood through shunted (unventilated) units never meets the extra oxygen. At 50% shunt, even 100% O₂ barely lifts PaO₂:</text>
   <text style="font-size: 10px; font-family:Inter, Arial, Helvetica, sans-serif" transform="translate(7.2 374.99)">only opening alveoli (PEEP, prone) fixes it. Illustrative curves (Hb 15, normal venous saturation).</text>
  </g>
